<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#020508">
<meta name="description" content="Snake néon en JavaScript : 2 modes, bonus, combos, obstacles et records sauvegardés.">
<title>Snake Néon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg-grid"></div>
<div class="glow-orb orb1"></div>
<div class="glow-orb orb2"></div>

<div class="wrapper">
  <header>
    <h1 class="logo">SN<span>A</span>KE</h1>
    <div class="hud">
      <div class="hud-block">
        <span class="hud-label">SCORE</span>
        <span class="hud-value" id="score">0</span>
      </div>
      <div class="hud-divider"></div>
      <div class="hud-block">
        <span class="hud-label">NIVEAU</span>
        <span class="hud-value" id="level">1</span>
      </div>
      <div class="hud-divider"></div>
      <div class="hud-block">
        <span class="hud-label">RECORD</span>
        <span class="hud-value" id="best">0</span>
      </div>
      <div class="hud-divider"></div>
      <div class="hud-block hud-buttons">
        <button id="btnPause" class="icon-btn" title="Pause [P]" aria-label="Pause">⏸</button>
        <button id="btnSound" class="icon-btn" title="Son [M]" aria-label="Couper le son">🔊</button>
      </div>
    </div>
    <div class="status-bar">
      <div class="combo" id="combo">COMBO <b>x1</b></div>
      <div class="progress" title="Pommes avant le niveau suivant"><div class="progress-fill" id="levelProgress"></div></div>
      <div class="effect hidden" id="slowEffect">❄ RALENTI</div>
    </div>
  </header>

  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="gameCanvas"></canvas>

    <!-- Menu principal -->
    <div class="overlay screen" id="screenMenu">
      <div class="overlay-inner">
        <p class="overlay-title">SNAKE</p>
        <p class="overlay-sub">Choisis ton mode</p>
        <div class="modes">
          <button class="mode-btn" data-mode="classic">
            <span class="mode-name">CLASSIQUE</span>
            <span class="mode-desc">Murs mortels · obstacles dès le niveau 3</span>
            <span class="mode-best">Record : <b data-best="classic">0</b></span>
          </button>
          <button class="mode-btn" data-mode="infinite">
            <span class="mode-name">INFINI</span>
            <span class="mode-desc">Traverse les bords · aucun obstacle</span>
            <span class="mode-best">Record : <b data-best="infinite">0</b></span>
          </button>
        </div>
        <button class="main-btn" id="btnStart">▶ JOUER</button>
        <div class="legend">
          <span><i class="dot apple"></i> Pomme +10</span>
          <span><i class="dot gold"></i> Étoile +50</span>
          <span><i class="dot ice"></i> Glace : ralentit</span>
        </div>
        <p class="overlay-hint desktop-only"><kbd>←↑→↓</kbd> / <kbd>ZQSD</kbd> bouger · <kbd>P</kbd> pause · <kbd>M</kbd> son</p>
        <p class="overlay-hint touch-only">Glisse sur l'écran ou utilise la croix</p>
      </div>
    </div>

    <!-- Pause -->
    <div class="overlay screen hidden" id="screenPause">
      <div class="overlay-inner">
        <p class="overlay-title">PAUSE</p>
        <button class="main-btn" id="btnResume">▶ REPRENDRE</button>
        <button class="ghost-btn" id="btnQuit">MENU</button>
      </div>
    </div>

    <!-- Game over -->
    <div class="overlay screen hidden" id="screenOver">
      <div class="overlay-inner">
        <p class="overlay-title over">GAME OVER</p>
        <p class="record hidden" id="newRecord">★ NOUVEAU RECORD ★</p>
        <div class="stats">
          <div><span>Score</span><b id="stScore">0</b></div>
          <div><span>Niveau</span><b id="stLevel">1</b></div>
          <div><span>Longueur</span><b id="stLength">3</b></div>
          <div><span>Temps</span><b id="stTime">0:00</b></div>
          <div><span>Meilleur combo</span><b id="stCombo">x1</b></div>
          <div><span>Record</span><b id="stBest">0</b></div>
        </div>
        <button class="main-btn" id="btnRetry">↻ REJOUER</button>
        <button class="ghost-btn" id="btnMenu">MENU</button>
      </div>
    </div>
  </div>

  <!-- D-pad (écrans tactiles uniquement) -->
  <div class="dpad" id="dpad">
    <div></div>
    <button class="dpad-btn" data-dir="up" aria-label="Haut">▲</button>
    <div></div>
    <button class="dpad-btn" data-dir="left" aria-label="Gauche">◀</button>
    <button class="dpad-btn dpad-center" id="dCenter" aria-label="Pause">❚❚</button>
    <button class="dpad-btn" data-dir="right" aria-label="Droite">▶</button>
    <div></div>
    <button class="dpad-btn" data-dir="down" aria-label="Bas">▼</button>
    <div></div>
  </div>
</div>

<script src="snake.js"></script>
</body>
</html>
